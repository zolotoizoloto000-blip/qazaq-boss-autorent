services:
  - type: web
    name: qazaq-boss-autorent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: REQUIRE_ADMIN
        value: "1"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: qazaq-boss-db
          property: connectionString

databases:
  - name: qazaq-boss-db
    databaseName: qazaq_boss
    user: qazaq_boss
    plan: free
